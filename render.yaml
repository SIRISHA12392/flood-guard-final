services:
  - type: web
    name: flood-guard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false        # Set this manually in the Render dashboard
      - key: FRONTEND_URL
        value: https://flood-guard-pro.vercel.app   # Update with your real Vercel URL
